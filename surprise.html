<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Special Surprise 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: black;
  overflow: hidden;
  color: white;
}

/* 📸 Slideshow container */
#slideshow {
  position: relative;
  width: 100vw;
  height: 100vh;
}

/* Images */
.slide {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;   /* ✅ FIXED */
  background: black;     /* optional (fills empty space nicely) */
  opacity: 0;
  animation: fade 15s infinite;
}

/* Animation delay for each image */
.slide:nth-child(1) { animation-delay: 0s; }
.slide:nth-child(2) { animation-delay: 5s; }
.slide:nth-child(3) { animation-delay: 10s; }

@keyframes fade {
  0% { opacity: 0; }
  10% { opacity: 1; }
  30% { opacity: 1; }
  40% { opacity: 0; }
  100% { opacity: 0; }
}

/* 💖 Text overlay */
#text {
  position: absolute;
  bottom: 40px;
  width: 100%;
  text-align: center;
  font-size: 22px;
  text-shadow: 0 0 10px black;
}
</style>
</head>

<body>

<div id="slideshow">
  <img class="slide" src="photo1.jpeg">
  <img class="slide" src="photo2.jpg">
  <img class="slide" src="photo3.jpg">

  <div id="text">
    ✨ Every moment with you is special 💖 <br>
    Happy Birthday once again 🎂
  </div>
</div>

<!-- 🎵 Background Music -->
<audio autoplay loop>
  <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mpeg">
</audio>

</body>
</html>
